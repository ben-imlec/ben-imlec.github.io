<body><main><div class="orta"><div class="yuz" aria-hidden="true">(<i></i><i></i>)</div><h1>İmleç</h1><p class="alt">Videolarda anlattığım her şey, adım adım.</p></div><input id="ara" type="search" placeholder="Konu ya da video numarası" aria-label="Rehberlerde ara"><ul class="l"><li><a href="bes-programa-para-odeme/index.html"><span class="no">#03</span><span><b>Bu 5 programa para ödeme</b><small>Ücretsiz programlar</small></span><span aria-hidden="true">›</span></a></li><li><a href="bulanik-fotografi-netlestir/index.html"><span class="no">#02</span><span><b>Bulanık fotoğrafı netleştir</b><small>Ücretsiz araç</small></span><span aria-hidden="true">›</span></a></li><li><a href="ben-kimim/index.html"><span class="no">#01</span><span><b>Ben kimim?</b><small>Tanışma</small></span><span aria-hidden="true">›</span></a></li></ul><p id="yok" class="orta alt" hidden>Bu aramayla eşleşen rehber yok.</p><script>
const a=document.getElementById('ara'),s=[...document.querySelectorAll('.l li')],n=x=>x.toLocaleLowerCase('tr').replace('#','').trim();
a.oninput=()=>{let k=0;for(const l of s){l.hidden=!n(l.textContent).includes(n(a.value));k+=!l.hidden}document.getElementById('yok').hidden=k>0};
</script></main></body></html>
